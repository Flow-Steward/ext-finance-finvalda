- action_id: register_payment
  title: Register payment
  description: 'Registers money received from a client (inflow) or paid to a supplier (disbursement),
    against one document or as a prepayment. Safe to run again: a payment of the client with the same
    document number, amount and paid invoice is returned instead of a second one; one bank statement may
    hold several payments, and a payment that cannot be told apart from an earlier one stops the step.
    Two real payments of the same client and amount on one statement, without an invoice, count as one:
    give the invoice, or a document number of its own for each payment.'
