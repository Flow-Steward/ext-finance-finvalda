page_id: finvalda-api
title: Finvalda API
description: 'Every Finvalda step: what it does, which Finvalda calls it makes, its inputs and results.'
components:
- component_id: operations_everyday
  type: markdown
  title: Everyday steps
  body: |
    These steps take plain inputs and make the Finvalda calls for you. Every documented method of the web service also has its own step, named **Advanced · …** in the step picker.

    ### Test the connection

    Reads one client to check the address, the web service user, the password and the company.

    - Action id: `test_connection`
    - Kind: read
    - Finvalda calls: `GetDescriptions type=Clients (one row)`
    - Inputs: none
    - Results: `connected`, `company_id`, `clients_visible`, `duration_ms`

    ### Find or create client

    Looks the client up by code, then company code, then VAT code, then e-mail; several matches are an error. Creates the client only when none matches.

    - Action id: `find_or_create_client`
    - Kind: write
    - Finvalda calls: `GetDescriptions type=Clients`, `InsertNewItem Fvs.Klientas`
    - Inputs: `code` (optional), `company_code` (optional), `vat_code` (optional), `email` (optional), `name` (optional), `address` (optional), `city` (optional), `country_code` (optional), `phone` (optional), `client_type` (optional), `is_person` (optional), `item_parameter` (optional)
    - Results: `client_code`, `created`, `matched_by`, `record`

    ### Find or create product

    Looks the product up by code, then barcode; creates it when none matches.

    - Action id: `find_or_create_product`
    - Kind: write
    - Finvalda calls: `GetDescriptions type=Products`, `GetDescriptions type=BarCodes`, `InsertNewItem Fvs.Preke`
    - Inputs: `code` (optional), `barcode` (optional), `name` (optional), `unit` (optional), `vat_code` (optional), `account_link` (optional), `product_type` (optional), `price` (optional), `purchase_price` (optional), `item_parameter` (optional)
    - Results: `product_code`, `created`, `matched_by`, `record`

    ### Find or create service

    Looks the service up by code; creates it when it does not exist.

    - Action id: `find_or_create_service`
    - Kind: write
    - Finvalda calls: `GetDescriptions type=Services`, `InsertNewItem Fvs.Paslauga`
    - Inputs: `code`, `name` (optional), `unit` (optional), `vat_code` (optional), `account_link` (optional), `price` (optional), `purchase_price` (optional), `item_parameter` (optional)
    - Results: `service_code`, `created`, `record`

    ### Create sales invoice

    Creates a sales invoice (PardDok) with product and service lines; amounts and VAT are computed from quantity, price, discount and VAT percent. The document number makes it safe to run again: the step first looks for a sales invoice of that client with that number and returns it instead of a second one, and Finvalda itself refuses a number already used. Can attach a file, such as the PDF.

    - Action id: `create_sales_invoice`
    - Kind: write
    - Finvalda calls: `GetOperations (look the document up)`, `InsertNewOperation PardDok`, `InsertDocument + AttachDocument (with a file)`
    - Inputs: `client_code` (optional), `client_company_code` (optional), `document`, `series` (optional), `date` (optional), `due_date` (optional), `currency` (optional), `warehouse` (optional), `notes` (optional), `lines`, `import_parameter` (optional), `document_file` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`, `created`, `client_code`, `total_without_vat`, `total_vat`, `attachment_name`, `record`

    ### Create purchase invoice

    Creates a purchase invoice (PirkDok) with product and service lines; amounts and VAT are computed from quantity, price, discount and VAT percent. The document number makes it safe to run again: the step first looks for a purchase invoice of that client with that number and returns it instead of a second one, and Finvalda itself refuses a number already used. Can attach a file, such as the PDF.

    - Action id: `create_purchase_invoice`
    - Kind: write
    - Finvalda calls: `GetOperations (look the document up)`, `InsertNewOperation PirkDok`, `InsertDocument + AttachDocument (with a file)`
    - Inputs: `client_code` (optional), `client_company_code` (optional), `document`, `series` (optional), `date` (optional), `due_date` (optional), `currency` (optional), `warehouse` (optional), `notes` (optional), `lines`, `import_parameter` (optional), `document_file` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`, `created`, `client_code`, `total_without_vat`, `total_vat`, `attachment_name`, `record`

    ### Register payment

    Registers money received from a client (inflow) or paid to a supplier (disbursement), against one document or as a prepayment. The payment's document number makes it safe to run again: an inflow or disbursement with that number for the client is returned instead of a second one.

    - Action id: `register_payment`
    - Kind: write
    - Finvalda calls: `GetOperations (look the payment up)`, `InsertNewOperation IplDok / IsmDok`
    - Inputs: `direction`, `client_code` (optional), `client_company_code` (optional), `document`, `amount`, `date` (optional), `currency` (optional), `invoice_series` (optional), `invoice_document` (optional), `description` (optional), `import_parameter` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`, `created`, `client_code`, `record`

    ### Download invoice PDF

    Prints a sale or purchase with an invoice form to a PDF workflow file, to e-mail it or archive it.

    - Action id: `download_invoice_pdf`
    - Kind: read
    - Finvalda calls: `MakeInvoice`
    - Inputs: `invoice_form`, `journal` (optional), `op_number` (optional), `series` (optional), `document` (optional)
    - Results: `document_file`, `file_name`, `size_bytes`

    ### Attach file

    Stores a workflow file in Finvalda and attaches it to a sale, a purchase or another operation, or to a client or product. A file of the same name already attached there is not attached twice.

    - Action id: `attach_file`
    - Kind: write
    - Finvalda calls: `GetAttachedDocument`, `InsertDocument`, `AttachDocument`
    - Inputs: `entity_type`, `entity_id1`, `entity_id2` (optional), `document_file`, `file_name`, `file_description` (optional)
    - Results: `file_name`, `stored`, `attached`

    ### Stock levels

    Current stock of products by warehouse: quantity, quantity with reservations and cost.

    - Action id: `stock_levels`
    - Kind: read
    - Finvalda calls: `GetDescriptions type=CurrentStock`
    - Inputs: `product_codes` (optional), `warehouse` (optional), `warehouse_group` (optional), `limit` (optional)
    - Results: `items`, `count`, `has_more`

    ### Product prices

    The six sales prices and the purchase price of products, and a client's special prices and discounts when a client is given.

    - Action id: `product_prices`
    - Kind: read
    - Finvalda calls: `GetDescriptions type=Products`, `GetDescriptions type=Prices`
    - Inputs: `product_codes`, `client_code` (optional)
    - Results: `items`, `client_prices`, `count`

    ### Client debt

    A client's current debt and unpaid sales documents, with the overdue part.

    - Action id: `client_debt`
    - Kind: read
    - Finvalda calls: `GetDescriptions type=Clients`, `GetNeapmoketiKliDok`
    - Inputs: `client_code`, `as_of` (optional)
    - Results: `client_code`, `client_name`, `debt`, `unpaid_total`, `overdue_total`, `documents`, `count`

    ### Changes since

    Records or operations created or edited since a moment: clients, products, services, sales, purchases, inflows, disbursements. Pass latest_edited as since next time.

    - Action id: `changes_since`
    - Kind: read
    - Finvalda calls: `GetDescriptions (EditedFrom)`, `GetOperations (DateEditedFrom)`
    - Inputs: `entity`, `since`, `limit` (optional)
    - Results: `records`, `count`, `latest_edited`, `has_more`
- component_id: operations_behaviour
  type: markdown
  title: How steps behave
  body: |
    ### The web service

    - Every step calls the Finvalda web service of your company (the FvsServicePure interface) with the web service user of the connection. A step can do exactly what that user may do in Finvalda.
    - Writes of operations use an import parameter (sParametras): a preset made in Finvalda's FvsNETParamKonfig tool that sets the journal, operation type, series and accounts. New clients, products and services can use an item import parameter the same way. Set defaults on the connection; a step can name another.
    - The older read methods answer with Lithuanian column names, or English ones when the connection's language is English. The list steps (List · …) and the operation steps (Operations · …) always use English column names.

    ### Inputs

    - Fields of records and operations use the names of Finvalda's manual (sKodas, sPavadinimas, tData, PardDokPrekeDetEil …). They are checked against the manual before anything is sent: an unknown field, a text that is too long or a value of the wrong kind is refused.
    - Dates are YYYY-MM-DD. Amounts are exact decimals with "." as the decimal point.

    ### Writes, retries and errors

    - Flow Steward remembers every change it made, so a retried step does not send it twice. Test runs never write.
    - When Finvalda refuses a change, it says why with its error code, and nothing was saved. The step shows the code and its meaning from the manual.
    - A timeout, a lost connection, a server error, or one of the errors the manual describes as a program or transaction failure leave the outcome unknown: the step is not retried, and you check Finvalda first.
    - Everyday steps look up before they create: clients and products by code, documents and payments by their number for that client. Finvalda itself refuses a document number already used.
    - If a step that writes several things fails half-way, it says exactly what was already saved.

    ### Lists and files

    - List steps read pages of up to 1000 rows. A step output has a size limit: a long read stops at a page boundary and returns next_page. For whole lists use Export a list to a file.
    - Operation steps read everything the filter matches in one answer: give a date range or a journal.
    - Files travel as workflow files: invoice and report PDFs, product pictures, documents attached to operations.
