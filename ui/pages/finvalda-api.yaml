- component_id: operations_records,
  type: markdown
  title: Records, operations and files
  body: |
    Creating, changing and deleting records and operations, PDFs, documents, prices and permissions.

    ### Create a record

    Creates a client, product, service, address, object, bank, warehouse, payment term, type or tag (InsertNewItem, manual 3.66). The fields are the manual's names for the class (for example sKodas, sPavadinimas) and are checked against it before anything is sent.

    - Action id: `insert_item`
    - Kind: write
    - Finvalda calls: `POST InsertNewItem`
    - Inputs: `item_class`, `fields`, `item_parameter` (optional)
    - Results: `item_class`, `code`, `finvalda_result`

    ### Update a record

    Changes fields of an existing client, product, service or other record (EditItem, manual 3.67). Only the fields given are sent.

    - Action id: `edit_item`
    - Kind: write
    - Finvalda calls: `POST EditItem`
    - Inputs: `item_class`, `item_code` (optional), `fields`, `item_parameter` (optional)
    - Results: `item_class`, `code`, `finvalda_result`

    ### Update many records

    Sets the same values on many products, services or clients at once (EditItemProps, manual 3.68 — named EditItemsProps in its method list).

    - Action id: `edit_item_props`
    - Kind: write
    - Finvalda calls: `POST EditItemProps`
    - Inputs: `changes`
    - Results: `finvalda_result`

    ### Delete a record

    Deletes a client, product, service or other record by code (DeleteItem, from the Postman collection). Finvalda refuses records that are in use.

    - Action id: `delete_item`
    - Kind: write
    - Finvalda calls: `POST DeleteItem`
    - Inputs: `item_class`, `item_code`
    - Results: `item_class`, `code`, `finvalda_result`

    ### Add a record to a group

    Adds a product, service, client, address, object or warehouse to a group (AppendGroup, manual 3.69).

    - Action id: `append_group`
    - Kind: write
    - Finvalda calls: `POST AppendGroup`
    - Inputs: `item_class`, `group_code`, `item_code`, `item_code2` (optional)
    - Results: `finvalda_result`

    ### Create an operation

    Creates any operation the manual documents — sale, purchase, return, reservation, order, internal transfer, write-off, receipt, inflow, disbursement, production, offset, stocktaking or other — with its lines (InsertNewOperation, manual 3.70). Header and line fields are checked against the manual first. Finvalda refuses a document number already used, so a rerun cannot save it twice.

    - Action id: `insert_operation`
    - Kind: write
    - Finvalda calls: `POST InsertNewOperation`
    - Inputs: `op_class`, `operation`, `import_parameter` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`

    ### Change an operation

    Changes a sale, purchase, reservation, return, order or internal transfer: header fields, lines removed, added or changed (UpdateOperation, manual 3.72).

    - Action id: `update_operation`
    - Kind: write
    - Finvalda calls: `POST UpdateOperation`
    - Inputs: `op_class`, `operation`, `import_parameter` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`

    ### Delete an operation

    Deletes a purchase, sale, reservation, return, order, internal transfer, inflow or production operation by journal and number (DeleteOperation, manual 3.71). Finvalda refuses settled, locked or reversed operations.

    - Action id: `delete_operation`
    - Kind: write
    - Finvalda calls: `POST DeleteOperation`
    - Inputs: `op_class`, `journal`, `op_number`, `import_parameter` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`

    ### Lock an operation

    Locks an operation so it cannot be changed (LockOperation, manual 3.73).

    - Action id: `lock_operation`
    - Kind: write
    - Finvalda calls: `POST LockOperation`
    - Inputs: `journal`, `op_number`, `import_parameter` (optional)
    - Results: `finvalda_result`

    ### Unlock an operation

    Unlocks an operation (UnLockOperation, manual 3.73).

    - Action id: `unlock_operation`
    - Kind: write
    - Finvalda calls: `POST UnLockOperation`
    - Inputs: `journal`, `op_number`, `import_parameter` (optional)
    - Results: `finvalda_result`

    ### Is an operation locked

    Whether an operation is locked: 0 not locked, 1 locked by an employee, 2 locked by the administrator (IsOperationLocked, manual 3.74).

    - Action id: `is_operation_locked`
    - Kind: read
    - Finvalda calls: `POST IsOperationLocked`
    - Inputs: `journal`, `op_number`
    - Results: `locked`, `lock_state`

    ### Move an operation to another journal

    Moves an operation to another journal (ChangeJournal, from the Postman collection).

    - Action id: `change_journal`
    - Kind: write
    - Finvalda calls: `POST ChangeJournal`
    - Inputs: `journal`, `op_number`, `new_journal`
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`

    ### Copy an operation

    Copies an operation into another journal, optionally deleting the source (CopyOperation, from the Postman collection).

    - Action id: `copy_operation`
    - Kind: write
    - Finvalda calls: `POST CopyOperation`
    - Inputs: `journal`, `op_number`, `new_journal`, `delete_source` (optional), `keep_document` (optional), `new_document` (optional), `new_series` (optional), `copy_doc_to_description` (optional), `import_parameter` (optional)
    - Results: `journal`, `op_number`, `series`, `document`, `finvalda_result`

    ### Invoice PDF

    Prints an operation with one of Finvalda's invoice forms to a PDF workflow file (MakeInvoice, manual 3.75). The forms are listed by List · Invoice forms.

    - Action id: `make_invoice`
    - Kind: read
    - Finvalda calls: `GET MakeInvoice`
    - Inputs: `invoice_form`, `journal` (optional), `op_number` (optional), `series` (optional), `document` (optional)
    - Results: `document_file`, `file_name`, `size_bytes`

    ### Report PDF

    Runs one of Finvalda's reports to a PDF workflow file (MakeReport, manual 3.76): balance, profit, sales and purchase lists, debts, stock. The codes are listed by List · Reports.

    - Action id: `make_report`
    - Kind: read
    - Finvalda calls: `GET MakeReport`
    - Inputs: `report_code`, `filter` (optional)
    - Results: `document_file`, `file_name`, `size_bytes`

    ### Automatic reports

    The names of the reports Finvalda prepares automatically (GetAutoReportsList, from the Postman collection).

    - Action id: `auto_reports_list`
    - Kind: read
    - Finvalda calls: `GET GetAutoReportsList`
    - Inputs: none
    - Results: `names`, `count`

    ### Automatic report file

    Downloads one automatically prepared report as a workflow file (GetAutoReport, from the Postman collection).

    - Action id: `auto_report`
    - Kind: read
    - Finvalda calls: `GET GetAutoReport`
    - Inputs: `report_name`
    - Results: `document_file`, `file_name`, `size_bytes`

    ### Product image

    Downloads a product's picture as a workflow file (GetPrekesImage, manual 3.45).

    - Action id: `product_image`
    - Kind: read
    - Finvalda calls: `GET GetPrekesImage`
    - Inputs: `product_code`, `edited_since` (optional), `created_since` (optional)
    - Results: `document_file`, `file_name`, `size_bytes`

    ### Upload a document

    Stores a workflow file in Finvalda's document register (InsertDocument, manual 3.80). Attach it to an operation or record with Attach a document.

    - Action id: `insert_document`
    - Kind: write
    - Finvalda calls: `POST InsertDocument`
    - Inputs: `document_file`, `file_name`, `file_description` (optional), `registration_number` (optional), `composition_date` (optional), `search_phrase` (optional), `info` (optional), `fin_user` (optional)
    - Results: `file_name`, `size_bytes`

    ### Delete a document

    Removes a document from Finvalda's register by its file name (DeleteDocument, manual 3.81).

    - Action id: `delete_document`
    - Kind: write
    - Finvalda calls: `POST DeleteDocument`
    - Inputs: `file_name`
    - Results: `file_name`

    ### Attach a document

    Attaches a document already in the register to an operation or a record (AttachDocument, manual 3.82). A document already attached there is reported, not attached twice.

    - Action id: `attach_document`
    - Kind: write
    - Finvalda calls: `GET AttachDocument`
    - Inputs: `entity_type`, `entity_id1`, `entity_id2` (optional), `file_name`, `fin_user` (optional)
    - Results: `attached`, `already_attached`

    ### Attached documents

    Lists the files attached to an operation or a record, and can save one of them as a workflow file (GetAttachedDocuments, manual 3.83; the Pure interface names it GetAttachedDocument).

    - Action id: `attached_documents`
    - Kind: read
    - Finvalda calls: `GET GetAttachedDocument`
    - Inputs: `entity_type`, `entity_id1`, `entity_id2` (optional), `file_name` (optional)
    - Results: `files`, `count`, `document_file`, `file_name`, `size_bytes`

    ### Recommended price

    The price, VAT and discount Finvalda would suggest for a line of a sale or a purchase (GetRecommendedPrice, manual 3.79).

    - Action id: `recommended_price`
    - Kind: read
    - Finvalda calls: `POST GetRecommendedPrice`
    - Inputs: `invoice_type`, `invoice_date`, `item_type`, `item_code`, `quantity`, `warehouse_code` (optional), `client_code` (optional), `client_address_code` (optional), `fin_user` (optional)
    - Results: `price`, `vat`, `discount`, `response`

    ### Employee permissions

    The warehouses, clients, operation types and journals a Finvalda employee may use (GetUserPermissions, manual 3.84).

    - Action id: `user_permissions`
    - Kind: read
    - Finvalda calls: `GET GetUserPermissions`
    - Inputs: `fin_user` (optional)
    - Results: `permissions`, `count`, `response`

    ### Invoices related to a client

    The invoices related to a client by debt type (GetInvoicesRelatedToCustomer, from the Postman collection).

    - Action id: `invoices_related_to_customer`
    - Kind: read
    - Finvalda calls: `POST GetInvoicesRelatedToCustomer`
    - Inputs: `client_code` (optional), `debt_type` (optional)
    - Results: `records`, `record`, `count`, `response`

    ### Export a list to a file

    Saves a whole GetDescriptions list — clients, products, stock, prices … — as a JSON Lines workflow file, page by page; it can resume where it stopped.

    - Action id: `export_list`
    - Kind: read
    - Finvalda calls: `POST GetDescriptions (every page)`
    - Inputs: `list_type`, `filter` (optional), `columns` (optional), `start_page` (optional), `max_pages` (optional)
    - Results: `artifact_handle`, `filename`, `content_type`, `record_count`, `pages_fetched`, `complete`, `resume_page`, `stopped_by`

    ### Call a Finvalda method

    Calls any method of the Finvalda web service by name, with query parameters or a JSON body, for cases the other steps do not cover. Counted as a change.

    - Action id: `call_method`
    - Kind: write
    - Finvalda calls: `any documented method`
    - Inputs: `method`, `verb`, `query` (optional), `body` (optional)
    - Results: `method`, `response`
- component_id: operations_older
  type: markdown
  title: Older read methods
  body: |
    Finvalda's older read methods, one step each, with the manual's parameters. They answer with Lithuanian column names unless the connection's language is English.

    ### Current stock

    Current stock of products by warehouse. Finvalda method GetEinamiejiLikuciai (manual section 3.2). Columns: sandelis, sandelio_pav, preke, prekes_pav, kiekis, kiekis_su_rezervuotom, mato_vnt_pav, pirm_antr_mat_sant, savikaina.

    - Action id: `get_einamieji_likuciai`
