    - `filter` (record, optional): Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber, OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup, Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser, Warehouse, GoodsCode, Object2, Object3, Object4, Object5, Object6, Object1, NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.
    - `columns` (list, optional): The columns to return; default all (for example date_created, date_edited, op_number, journal, op_date, series, order_number, client, amount, …).

    **Results**

    - `records` (list of records): The sales reservation lines Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `date_created`, `date_edited`, `op_number`, `journal`, `type`, `code`, `title`, `quantity`, `code_n`, `warehouse`, `amount_nc`, `amount`, `vat_nc`, `vat`, `discount_nc`, `discount`, ….
    - `count` (whole number): How many rows were returned.

    ### Operations · Purchase orders

    Purchase orders, read with Finvalda's GetOperations method, class PurchaseOrders (documented in manual section 3.77). Give a filter — a date range, a journal, a client — to keep the answer small.

    Action id `operations_purchase_orders` · reads only · Finvalda: `POST GetOperations OpClass=PurchaseOrders`

    **Inputs**

    - `filter` (record, optional): Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber, OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup, Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser, NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.
    - `columns` (list, optional): The columns to return; default all (for example date_created, date_edited, op_number, journal, op_date, series, order_number, client, amount, …).
    - `full_op` (yes/no, optional): Return each operation with its lines.
    - `columns_det` (list, optional): With lines: the line columns to return, for example code, title, quantity, amount.

    **Results**

    - `records` (list of records): The purchase orders, with their lines under full_op Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `date_created`, `date_edited`, `op_number`, `journal`, `op_date`, `payment_date`, `issue_date`, `series`, `order_number`, `order_number_a`, `client`, `client_a`, `client_code`, `client_code_a`, `client_vatcode`, `client_vatcode_a`, ….
    - `count` (whole number): How many rows were returned.

    ### Operations · Purchase order lines

    Purchase order lines, read with Finvalda's GetOperations method, class PurchaseOrdersDet (documented in manual section 3.77). Give a filter — a date range, a journal, a client — to keep the answer small.

    Action id `operations_purchase_orders_det` · reads only · Finvalda: `POST GetOperations OpClass=PurchaseOrdersDet`

    **Inputs**

    - `filter` (record, optional): Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber, OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup, Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser, Warehouse, GoodsCode, Object2, Object3, Object4, Object5, Object6, Object1, NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.
    - `columns` (list, optional): The columns to return; default all (for example date_created, date_edited, op_number, journal, op_date, series, order_number, client, amount, …).

    **Results**

    - `records` (list of records): The purchase order lines Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `date_created`, `date_edited`, `op_number`, `journal`, `type`, `code`, `title`, `quantity`, `code_n`, `warehouse`, `amount_nc`, `amount`, `vat_nc`, `vat`, `discount_nc`, `discount`, ….
    - `count` (whole number): How many rows were returned.

    ### Operations · Internal transfers

    Internal transfers, read with Finvalda's GetOperations method, class InternalTransactions (documented in manual section 3.77). Give a filter — a date range, a journal, a client — to keep the answer small.

    Action id `operations_internal_transactions` · reads only · Finvalda: `POST GetOperations OpClass=InternalTransactions`

    **Inputs**

    - `filter` (record, optional): Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber, OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup, Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser, NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.
    - `columns` (list, optional): The columns to return; default all (for example date_created, date_edited, op_number, journal, op_date, series, order_number, client, amount, …).
    - `full_op` (yes/no, optional): Return each operation with its lines.
    - `columns_det` (list, optional): With lines: the line columns to return, for example code, title, quantity, amount.

    **Results**

    - `records` (list of records): The internal transfers, with their lines under full_op Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `date_created`, `date_edited`, `op_number`, `journal`, `op_date`, `payment_date`, `issue_date`, `series`, `order_number`, `order_number_a`, `client`, `client_a`, `client_code`, `client_code_a`, `client_vatcode`, `client_vatcode_a`, ….
    - `count` (whole number): How many rows were returned.

    ### Operations · Internal transfer lines

    Internal transfer lines, read with Finvalda's GetOperations method, class InternalTransactionsDet (documented in manual section 3.77). Give a filter — a date range, a journal, a client — to keep the answer small.

    Action id `operations_internal_transactions_det` · reads only · Finvalda: `POST GetOperations OpClass=InternalTransactionsDet`

    **Inputs**

    - `filter` (record, optional): Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber, OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup, Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser, Warehouse, GoodsCode, Object2, Object3, Object4, Object5, Object6, Object1, NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.
    - `columns` (list, optional): The columns to return; default all (for example date_created, date_edited, op_number, journal, op_date, series, order_number, client, amount, …).

    **Results**

    - `records` (list of records): The internal transfer lines Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `date_created`, `date_edited`, `op_number`, `journal`, `type`, `code`, `title`, `quantity`, `code_n`, `warehouse`, `amount_nc`, `amount`, `vat_nc`, `vat`, `discount_nc`, `discount`, ….
    - `count` (whole number): How many rows were returned.

    ### Operations · Production

    Production, read with Finvalda's GetOperations method, class Production (documented in the Postman collection). Give a filter — a date range, a journal, a client — to keep the answer small.

    Action id `operations_production` · reads only · Finvalda: `POST GetOperations OpClass=Production`

    **Inputs**

    - `filter` (record, optional): Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber, OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup, Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser, NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.
    - `columns` (list, optional): The columns to return; default all (for example date_created, date_edited, op_number, journal, op_date, series, order_number, client, amount, …).
    - `full_op` (yes/no, optional): Return each operation with its lines.
    - `columns_det` (list, optional): With lines: the line columns to return, for example code, title, quantity, amount.

    **Results**

    - `records` (list of records): The production, with their lines under full_op Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `date_created`, `date_edited`, `op_number`, `journal`, `op_date`, `payment_date`, `issue_date`, `series`, `order_number`, `order_number_a`, `client`, `client_a`, `client_code`, `client_code_a`, `client_vatcode`, `client_vatcode_a`, ….
    - `count` (whole number): How many rows were returned.
- component_id: operations_writes_and_files
  type: markdown
  title: Records, operations and files
  body: |
    Creating, changing and deleting records and operations, PDFs, documents, prices and permissions.

    ### Create a record

    Creates a client, product, service, address, object, bank, warehouse, payment term, type or tag (InsertNewItem, manual 3.66). The fields are the manual's names for the class (for example sKodas, sPavadinimas) and are checked against it before anything is sent.

    Action id `insert_item` · changes data in Finvalda · Finvalda: `POST InsertNewItem`

    **Inputs**

    - `item_class` (one of Fvs.Adresas, Fvs.AtsTerminas, Fvs.Bankas, Fvs.Klientas, Fvs.KlientoIIIPoz, Fvs.KlientoIIPoz, Fvs.KlientoIPoz, Fvs.KlientoRusis, …): The kind of record, for example Fvs.Klientas.
    - `fields` (object): The record's fields by the manual's names, for example {"sKodas": "UAB1", "sPavadinimas": "UAB Pavyzdys"}.
    - `item_parameter` (text, optional): The Finvalda import parameter for new records (sFvsImportoParametras), which fills accounts, VAT and unit. Default: the connection's item import parameter.

    **Results**

    - `item_class` (text)
    - `code` (text): The new record's code.
    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Update a record

    Changes fields of an existing client, product, service or other record (EditItem, manual 3.67). Only the fields given are sent.

    Action id `edit_item` · changes data in Finvalda · Finvalda: `POST EditItem`

    **Inputs**

    - `item_class` (one of Fvs.Adresas, Fvs.AtsTerminas, Fvs.Bankas, Fvs.Klientas, Fvs.KlientoIIIPoz, Fvs.KlientoIIPoz, Fvs.KlientoIPoz, Fvs.KlientoRusis, …): The kind of record, for example Fvs.Preke.
    - `item_code` (text, optional): The record's code (not needed for Fvs.Adresas).
    - `fields` (object): The fields to change, by the manual's names.
    - `item_parameter` (text, optional): The Finvalda import parameter for new records (sFvsImportoParametras), which fills accounts, VAT and unit. Default: the connection's item import parameter.

    **Results**

    - `item_class` (text)
    - `code` (text)
    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Update many records

    Sets the same values on many products, services or clients at once (EditItemProps, manual 3.68 — named EditItemsProps in its method list).

    Action id `edit_item_props` · changes data in Finvalda · Finvalda: `POST EditItemProps`

    **Inputs**

    - `changes` (object): One entry per group: {"Fvs.Prekes": {"Kodas": ["P1", "P2"], "pardKaina1": 13.1}}. Groups: Fvs.Prekes, Fvs.Paslaugos, Fvs.Klientas; values by the manual's names.

    **Results**

    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Delete a record

    Deletes a client, product, service or other record by code (DeleteItem, from the Postman collection). Finvalda refuses records that are in use.

    Action id `delete_item` · changes data in Finvalda · Finvalda: `POST DeleteItem`

    **Inputs**

    - `item_class` (one of Fvs.Adresas, Fvs.AtsTerminas, Fvs.Bankas, Fvs.Klientas, Fvs.KlientoIIIPoz, Fvs.KlientoIIPoz, Fvs.KlientoIPoz, Fvs.KlientoRusis, …): The kind of record, for example Fvs.Klientas.
    - `item_code` (text): The code of the record.

    **Results**

    - `item_class` (text)
    - `code` (text)
    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Add a record to a group

    Adds a product, service, client, address, object or warehouse to a group (AppendGroup, manual 3.69).

    Action id `append_group` · changes data in Finvalda · Finvalda: `POST AppendGroup`

    **Inputs**

    - `item_class` (one of Fvs.Preke, Fvs.Paslauga, Fvs.Klientas, Fvs.Adresas, Fvs.ObjektasI, Fvs.ObjektasII, Fvs.ObjektasIII, Fvs.ObjektasIV, …): The kind of group, for example Fvs.Preke for a product group.
    - `group_code` (text): The code of the group.
    - `item_code` (text): The code of the record.
    - `item_code2` (text, optional): For an address group: the address's client code.

    **Results**

    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Create an operation

    Creates any operation the manual documents — sale, purchase, return, reservation, order, internal transfer, write-off, receipt, inflow, disbursement, production, offset, stocktaking or other — with its lines (InsertNewOperation, manual 3.70). Header and line fields are checked against the manual first. Finvalda refuses a document number already used, so a rerun cannot save it twice.

    Action id `insert_operation` · changes data in Finvalda · Finvalda: `POST InsertNewOperation`

    **Inputs**

    - `op_class` (one of GamybaDok, Inventorizacija, IplDok, IsmDok, KtNeanalitDok, NurasymasDok, PajamavimasDok, PardDok, …): The operation class, for example PardDok for a sale.
    - `operation` (object): Header fields by the manual's names, with lines as arrays under their class: {"sKlientas": "K1", "tData": "2026-11-10", "sDokumentas": "S-1", "sValiuta": "EUR", "PardDokPrekeDetEil": [{...}]}.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.

    ### Change an operation

    Changes a sale, purchase, reservation, return, order or internal transfer: header fields, lines removed, added or changed (UpdateOperation, manual 3.72).

    Action id `update_operation` · changes data in Finvalda · Finvalda: `POST UpdateOperation`

    **Inputs**

    - `op_class` (one of KoregPardDok, KoregPardGrazDok, KoregPardRezDok, KoregPirkDok, KoregPirkGrazDok, KoregPirkUzsDok, KoregVidPerkDok): The change class, for example KoregPardDok.
    - `operation` (object): sZurnalas and nNumeris of the operation, then the change blocks: {"sZurnalas": "PARD", "nNumeris": 19, "PardDokHeadEil": {...}, "DelPrekeDetEil": [{...}], "PardDokPrekeDetEil": [{...}]}.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.

    ### Delete an operation

    Deletes a purchase, sale, reservation, return, order, internal transfer, inflow or production operation by journal and number (DeleteOperation, manual 3.71). Finvalda refuses settled, locked or reversed operations.

    Action id `delete_operation` · changes data in Finvalda · Finvalda: `POST DeleteOperation`

    **Inputs**

    - `op_class` (one of DelPirkDok, DelPirkUzsDok, DelPirkGrazDok, DelPardDok, DelPardRezDok, DelPardGrazDok, DelVidPerkDok, DelIplDok, …): The class, for example DelPardDok for a sale.
    - `journal` (text): The operation's journal code, for example PARD.
    - `op_number` (whole number): The operation's number in its journal.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.

    ### Lock an operation

    Locks an operation so it cannot be changed (LockOperation, manual 3.73).

    Action id `lock_operation` · changes data in Finvalda · Finvalda: `POST LockOperation`

    **Inputs**

    - `journal` (text): The operation's journal code, for example PARD.
    - `op_number` (whole number): The operation's number in its journal.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Unlock an operation

    Unlocks an operation (UnLockOperation, manual 3.73).

    Action id `unlock_operation` · changes data in Finvalda · Finvalda: `POST UnLockOperation`

    **Inputs**

    - `journal` (text): The operation's journal code, for example PARD.
    - `op_number` (whole number): The operation's number in its journal.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `saved` (yes/no): True when Finvalda confirmed the change.

    ### Is an operation locked

    Whether an operation is locked: 0 not locked, 1 locked by an employee, 2 locked by the administrator (IsOperationLocked, manual 3.74).

    Action id `is_operation_locked` · reads only · Finvalda: `POST IsOperationLocked`

    **Inputs**

    - `journal` (text): The operation's journal code, for example PARD.
    - `op_number` (whole number): The operation's number in its journal.

    **Results**

    - `locked` (yes/no)
    - `lock_state` (whole number): 0, 1 or 2.

    ### Move an operation to another journal

    Moves an operation to another journal (ChangeJournal, from the Postman collection).

    Action id `change_journal` · changes data in Finvalda · Finvalda: `POST ChangeJournal`

    **Inputs**

    - `journal` (text): The operation's journal code, for example PARD.
    - `op_number` (whole number): The operation's number in its journal.
    - `new_journal` (text): The journal to move it to.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.

    ### Copy an operation

    Copies an operation into another journal, optionally deleting the source (CopyOperation, from the Postman collection).

    Action id `copy_operation` · changes data in Finvalda · Finvalda: `POST CopyOperation`

    **Inputs**

    - `journal` (text): The operation's journal code, for example PARD.
    - `op_number` (whole number): The operation's number in its journal.
    - `new_journal` (text): The journal of the copy.
    - `delete_source` (yes/no, optional): Delete the original once it is copied.
    - `keep_document` (yes/no, optional): Keep the original document number.
    - `new_document` (text, optional): The copy's document number.
    - `new_series` (text, optional): The copy's document series.
    - `copy_doc_to_description` (whole number, optional): Which operation name (1-5) receives the original document number; 0 none.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.

    ### Invoice PDF

    Prints an operation with one of Finvalda's invoice forms to a PDF workflow file (MakeInvoice, manual 3.75). The forms are listed by List · Invoice forms.

    Action id `make_invoice` · reads only · Finvalda: `GET MakeInvoice`

    **Inputs**

    - `invoice_form` (text): The form's code, for example PARD_01.
    - `journal` (text, optional): The operation's journal; with op_number.
    - `op_number` (whole number, optional): The operation's number; with journal.
    - `series` (text, optional): The document series; with document.
    - `document` (text, optional): The document number; with series.

    **Results**

    - `document_file` (file): A workflow file.
    - `file_name` (text): The file's name.
    - `size_bytes` (whole number): The file's size.

    ### Report PDF

    Runs one of Finvalda's reports to a PDF workflow file (MakeReport, manual 3.76): balance, profit, sales and purchase lists, debts, stock. The codes are listed by List · Reports.

    Action id `make_report` · reads only · Finvalda: `GET MakeReport`

    **Inputs**

    - `report_code` (text): The report's code, for example BALANSAS_01.
    - `filter` (object, optional): The report's filter, with any of: Warehouse, WarehouseGroup, Goods, Client, DateFrom, DateTo, Logbook, LogbookGroup, OpType, OpTypeGroup, IncludeReturns. Dates are YYYY.MM.DD.

    **Results**

    - `document_file` (file): A workflow file.
    - `file_name` (text): The file's name.
    - `size_bytes` (whole number): The file's size.

    ### Automatic reports

    The names of the reports Finvalda prepares automatically (GetAutoReportsList, from the Postman collection).

    Action id `auto_reports_list` · reads only · Finvalda: `GET GetAutoReportsList`

    **Inputs**

    - none

    **Results**

    - `names` (list): The report file names.
    - `count` (whole number): How many rows were returned.

    ### Automatic report file

    Downloads one automatically prepared report as a workflow file (GetAutoReport, from the Postman collection).

    Action id `auto_report` · reads only · Finvalda: `GET GetAutoReport`

    **Inputs**

    - `report_name` (text): The name from Automatic reports.

    **Results**

    - `document_file` (file): A workflow file.
    - `file_name` (text): The file's name.
    - `size_bytes` (whole number): The file's size.

    ### Product image

    Downloads a product's picture as a workflow file (GetPrekesImage, manual 3.45).

    Action id `product_image` · reads only · Finvalda: `GET GetPrekesImage`

    **Inputs**

    - `product_code` (text): The product's code in Finvalda.
    - `edited_since` (date and time, optional): Only when the picture changed on or after this date, YYYY-MM-DD.
    - `created_since` (date and time, optional): Only when the product was created on or after this date.

    **Results**

    - `document_file` (file): A workflow file.
    - `file_name` (text): The file's name.
    - `size_bytes` (whole number): The file's size.

    ### Upload a document

    Stores a workflow file in Finvalda's document register (InsertDocument, manual 3.80). Attach it to an operation or record with Attach a document.

    Action id `insert_document` · changes data in Finvalda · Finvalda: `POST InsertDocument`

    **Inputs**

    - `document_file` (file): A workflow file.
    - `file_name` (text): The name to store it under, with its extension, for example S-1.pdf.
    - `file_description` (text, optional): A description of the document.
    - `registration_number` (text, optional): The document's registration number.
    - `composition_date` (date and time, optional): The document's date, YYYY-MM-DD. Default: today.
    - `search_phrase` (text, optional): Words to find the document by.
    - `info` (list, optional): Up to three lines of information.
    - `fin_user` (text, optional): The Finvalda employee the change is made as (not the web service user). Default: the connection's Finvalda employee.

    **Results**

    - `file_name` (text)
    - `size_bytes` (whole number)

    ### Delete a document

    Removes a document from Finvalda's register by its file name (DeleteDocument, manual 3.81).

    Action id `delete_document` · changes data in Finvalda · Finvalda: `POST DeleteDocument`

    **Inputs**

    - `file_name` (text): The stored file name, with its extension.

    **Results**

    - `file_name` (text)

    ### Attach a document

    Attaches a document already in the register to an operation or a record (AttachDocument, manual 3.82). A document already attached there is reported, not attached twice.

    Action id `attach_document` · changes data in Finvalda · Finvalda: `GET AttachDocument`

    **Inputs**

    - `entity_type` (one of 1, 2, 3, 7, 8, 16, 74, 75, …): What the file belongs to: an operation (sale, purchase …) or a record (client, product …).
    - `entity_id1` (text): A record's code, or an operation's journal code.
    - `entity_id2` (text, optional): An operation's number, or an address's code; empty for one-code records.
    - `file_name` (text): The stored file name, with its extension.
    - `fin_user` (text, optional): The Finvalda employee the change is made as (not the web service user). Default: the connection's Finvalda employee.

    **Results**

    - `attached` (yes/no)
    - `already_attached` (yes/no)

    ### Attached documents

    Lists the files attached to an operation or a record, and can save one of them as a workflow file (GetAttachedDocuments, manual 3.83; the Pure interface names it GetAttachedDocument).

    Action id `attached_documents` · reads only · Finvalda: `GET GetAttachedDocument`

    **Inputs**

    - `entity_type` (one of 1, 2, 3, 7, 8, 16, 74, 75, …): What the file belongs to: an operation (sale, purchase …) or a record (client, product …).
    - `entity_id1` (text): A record's code, or an operation's journal code.
    - `entity_id2` (text, optional): An operation's number, or an address's code; empty for one-code records.
    - `file_name` (text, optional): Save the attached file with this name as a workflow file.

    **Results**

    - `files` (list of records): The attached files. Fields: `name`, `size_bytes`.
    - `count` (whole number): How many rows were returned.
    - `document_file` (file): A workflow file.
    - `file_name` (text): The file's name.
    - `size_bytes` (whole number): The file's size.

    ### Recommended price

    The price, VAT and discount Finvalda would suggest for a line of a sale or a purchase (GetRecommendedPrice, manual 3.79).

    Action id `recommended_price` · reads only · Finvalda: `POST GetRecommendedPrice`

    **Inputs**

    - `invoice_type` (one of 0, 1): The sales or the purchases group.
    - `invoice_date` (date and time): The operation date, YYYY-MM-DD.
    - `item_type` (one of 1, 2): A product or a service.
    - `item_code` (text): The product's or service's code.
    - `quantity` (decimal): The quantity of the line.
    - `warehouse_code` (text, optional): The warehouse of the line.
    - `client_code` (text, optional): The client of the operation.
    - `client_address_code` (text, optional): The address of the operation.
    - `fin_user` (text, optional): The Finvalda employee the change is made as (not the web service user). Default: the connection's Finvalda employee.

    **Results**

    - `price` (decimal): Price without discount and VAT.
    - `vat` (decimal): VAT.
    - `discount` (decimal): Discount.
    - `response` (object): The rest of Finvalda's answer, as sent: everything but the rows and the status fields (null when there is nothing else).
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Employee permissions

    The warehouses, clients, operation types and journals a Finvalda employee may use (GetUserPermissions, manual 3.84).

    Action id `user_permissions` · reads only · Finvalda: `GET GetUserPermissions`

    **Inputs**

    - `fin_user` (text, optional): The Finvalda employee the change is made as (not the web service user). Default: the connection's Finvalda employee.

    **Results**

    - `permissions` (list of records): One entry per permission class (manual 3.84). Fields: `perrmisionClass`, `perrmisionCode`, `permittedEntities`.
    - `count` (whole number): How many rows were returned.
    - `response` (object): The rest of Finvalda's answer, as sent: everything but the rows and the status fields (null when there is nothing else).

    ### Invoices related to a client

    The invoices related to a client by debt type (GetInvoicesRelatedToCustomer, from the Postman collection, which shows only nDebtType; the client is sent as sKlientoKodas, the name a published client of the web service uses).

    Action id `invoices_related_to_customer` · reads only · Finvalda: `POST GetInvoicesRelatedToCustomer`

    **Inputs**

    - `client_code` (text, optional): The client's code in Finvalda.
    - `debt_type` (whole number, optional): The collection's nDebtType, for example 0.

    **Results**

    - `records` (list): The rows Finvalda returned. Columns not documented by Finvalda. Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them.
    - `count` (whole number): How many rows were returned.
    - `response` (object): The rest of Finvalda's answer, as sent: everything but the rows and the status fields (null when there is nothing else).

    ### Export a list to a file

    Saves a whole GetDescriptions list — clients, products, stock, prices … — as a JSON Lines workflow file, page by page; it can resume where it stopped.

    Action id `export_list` · reads only · Finvalda: `POST GetDescriptions (every page)`

    **Inputs**

    - `list_type` (one of Accounts, Address, BarCodes, CalendarEvents, ClientGroups, ClientIndividualCards, Clients, CompanyWorkStart, …): The GetDescriptions type, for example Clients.
    - `filter` (object, optional): The same filter as the list's own step.
    - `columns` (list, optional): The columns to save; default all.
    - `start_page` (whole number, optional): The page to start from; pass resume_page to continue.
    - `max_pages` (whole number, optional): At most this many pages of 1000 rows, 1 to 2000.

    **Results**

    - `artifact_handle` (file): A workflow file.
    - `filename` (text)
    - `content_type` (text)
    - `record_count` (whole number)
    - `pages_fetched` (whole number)
    - `complete` (yes/no): True when the last page was reached.
    - `resume_page` (whole number): The page to continue from.
    - `stopped_by` (text): Why the export stopped early.

    ### Call a Finvalda method

    Calls any method of the Finvalda web service by name, with query parameters or a JSON body, for cases the other steps do not cover. Counted as a change.

    Action id `call_method` · changes data in Finvalda · Finvalda: `any documented method`

    **Inputs**

    - `method` (text): The method name, for example GetKlientusSet.
    - `verb` (one of GET, POST): GET or POST, as the method expects.
    - `query` (object, optional): Parameters for the address, for example {"sKliKod": "K1"}.
    - `body` (object, optional): A JSON body for POST.

    **Results**

    - `method` (text)
    - `response` (object): The rest of Finvalda's answer, as sent: everything but the rows and the status fields (null when there is nothing else).
