page_id: finvalda-api
title: Finvalda API
description: 'Every Finvalda step: what it does, which Finvalda calls it makes, its inputs and results.'
components:
- component_id: operations_everyday
  type: markdown
  title: Everyday steps
  body: |
    These steps take plain inputs and make the Finvalda calls for you. Every documented method of the web service also has its own step, named **Advanced · …** in the step picker.

    ### Test the connection

    Reads one client to check the address, the web service user, the password and the company.

    Action id `test_connection` · reads only · Finvalda: `GetDescriptions type=Clients (one row)`

    **Inputs**

    - none

    **Results**

    - `connected` (yes/no): True when Finvalda answered.
    - `company_id` (text): The company the connection reads, if set.
    - `clients_visible` (yes/no): Whether the user can see at least one client.
    - `duration_ms` (whole number): How long the check took, in milliseconds.
    - `warnings` (list): What is missing for some steps (the Finvalda employee, the import parameter).

    ### Find or create client

    Looks the client up by code, then company code, then VAT code, then e-mail; several matches are an error. Creates the client only when none matches.

    Action id `find_or_create_client` · changes data in Finvalda · Finvalda: `GetDescriptions type=Clients`, `InsertNewItem Fvs.Klientas`

    **Inputs**

    - `code` (text, optional): The client's code, looked up first and used for a new client (capital letters and digits).
    - `company_code` (text, optional): The company code, looked up second.
    - `vat_code` (text, optional): The VAT payer code, looked up third.
    - `email` (text, optional): The e-mail address, looked up last.
    - `name` (text, optional): The name, needed when the client has to be created.
    - `address` (text, optional): The address of a new client.
    - `city` (text, optional): The city of a new client.
    - `country_code` (text, optional): The ISO country code of a new client, for example LT.
    - `phone` (text, optional): The phone number of a new client.
    - `client_type` (text, optional): The client type code of a new client.
    - `is_person` (yes/no, optional): The new client is a natural person, not a company.
    - `item_parameter` (text, optional): The Finvalda import parameter for new records (sFvsImportoParametras), which fills accounts, VAT and unit. Default: the connection's item import parameter.

    **Results**

    - `client_code` (text): The client's code.
    - `created` (yes/no): True when this step created the client.
    - `matched_by` (text): code, company_code, vat_code or email.
    - `client` (record): The client. Fields: `code`, `name`, `company_code`, `vat_code`, `email`, `address`, `city`, `country`, `phone`, `type`, `currency`, `debt`, `edited_at`.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Find or create product

    Looks the product up by code, then barcode; creates it when none matches.

    Action id `find_or_create_product` · changes data in Finvalda · Finvalda: `GetDescriptions type=Products`, `GetDescriptions type=BarCodes`, `InsertNewItem Fvs.Preke`

    **Inputs**

    - `code` (text, optional): The product's code, looked up first and used for a new product.
    - `barcode` (text, optional): The barcode, looked up second.
    - `name` (text, optional): The name, needed when the product has to be created.
    - `unit` (text, optional): The unit of measure code of a new product, for example VNT.
    - `vat_code` (text, optional): The VAT (tax) code of a new product.
    - `account_link` (text, optional): The link to accounts of a new product.
    - `product_type` (text, optional): The type code of a new product.
    - `price` (decimal, optional): The first sales price of a new product.
    - `purchase_price` (decimal, optional): The purchase price of a new product.
    - `item_parameter` (text, optional): The Finvalda import parameter for new records (sFvsImportoParametras), which fills accounts, VAT and unit. Default: the connection's item import parameter.

    **Results**

    - `product_code` (text): The product's code.
    - `created` (yes/no): True when this step created the product.
    - `matched_by` (text): code or barcode.
    - `product` (record): The product. Fields: `code`, `name`, `unit`, `barcode`, `type`, `price`, `currency`, `purchase_price`, `vat_percent`, `edited_at`.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Find or create service

    Looks the service up by code; creates it when it does not exist.

    Action id `find_or_create_service` · changes data in Finvalda · Finvalda: `GetDescriptions type=Services`, `InsertNewItem Fvs.Paslauga`

    **Inputs**

    - `code` (text): The service's code in Finvalda.
    - `name` (text, optional): The name, needed when the service has to be created.
    - `unit` (text, optional): The unit of measure of a new service.
    - `vat_code` (text, optional): The VAT (tax) code of a new service.
    - `account_link` (text, optional): The link to accounts of a new service.
    - `price` (decimal, optional): The sales price of a new service.
    - `purchase_price` (decimal, optional): The purchase price of a new service.
    - `item_parameter` (text, optional): The Finvalda import parameter for new records (sFvsImportoParametras), which fills accounts, VAT and unit. Default: the connection's item import parameter.

    **Results**

    - `service_code` (text): The service's code.
    - `created` (yes/no): True when this step created the service.
    - `service` (record): The service. Fields: `code`, `name`, `unit`, `price`, `purchase_price`, `vat_percent`, `edited_at`.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Create sales invoice

    Creates a sales invoice (PardDok) with product and service lines; amounts and VAT are computed from quantity, price, discount and VAT percent. The document number makes it safe to run again: the step first looks for a sales invoice of that client with that number and returns it instead of a second one, and Finvalda itself refuses a number already used. Can attach a file, such as the PDF, for which the connection needs a Finvalda employee.

    Action id `create_sales_invoice` · changes data in Finvalda · Finvalda: `GetOperations (look the document up)`, `InsertNewOperation PardDok`, `InsertDocument + AttachDocument (with a file)`

    **Inputs**

    - `client_code` (text, optional): The client's code in Finvalda.
    - `client_company_code` (text, optional): The client's company code; used when no client code is given.
    - `document` (text): The sales invoice's number, for example S-1001. Makes reruns safe.
    - `series` (text, optional): The document series. Default: from the import parameter.
    - `date` (date and time, optional): The operation date, YYYY-MM-DD. Default: today.
    - `due_date` (date and time, optional): The payment date, YYYY-MM-DD.
    - `currency` (text, optional): A currency code such as EUR. Default: EUR.
    - `warehouse` (text, optional): The warehouse for product lines that name none.
    - `notes` (text, optional): A note saved on the operation.
    - `lines` (list of records): The lines, 1 to 200: kind (product or service), code, quantity, price without VAT, discount_percent, vat_percent, warehouse.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.
    - `document_file` (file, optional): A workflow file.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.
    - `created` (yes/no): False when the same document was found and returned.
    - `client_code` (text): The client's code.
    - `currency` (text): The document currency.
    - `amount` (text): The document's amount as Finvalda shows it, exact decimal.
    - `total_without_vat` (text): Of a new document: its lines without VAT, exact decimal.
    - `total_vat` (text): Of a new document: its VAT, exact decimal.
    - `attachment_name` (text): The attached file's name in Finvalda.
    - `invoice` (record): The document as Finvalda has it. Fields: `journal`, `op_number`, `series`, `document`, `client_code`, `client_name`, `date`, `payment_date`, `currency`, `amount`, `created_at`, `edited_at`.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Create purchase invoice

    Creates a purchase invoice (PirkDok) with product and service lines; amounts and VAT are computed from quantity, price, discount and VAT percent. The document number makes it safe to run again: the step first looks for a purchase invoice of that client with that number and returns it instead of a second one, and Finvalda itself refuses a number already used. Can attach a file, such as the PDF, for which the connection needs a Finvalda employee.

    Action id `create_purchase_invoice` · changes data in Finvalda · Finvalda: `GetOperations (look the document up)`, `InsertNewOperation PirkDok`, `InsertDocument + AttachDocument (with a file)`

    **Inputs**

    - `client_code` (text, optional): The client's code in Finvalda.
    - `client_company_code` (text, optional): The client's company code; used when no client code is given.
    - `document` (text): The purchase invoice's number, for example the supplier's invoice number. Makes reruns safe.
    - `series` (text, optional): The document series. Default: from the import parameter.
    - `date` (date and time, optional): The operation date, YYYY-MM-DD. Default: today.
    - `due_date` (date and time, optional): The payment date, YYYY-MM-DD.
    - `currency` (text, optional): A currency code such as EUR. Default: EUR.
    - `warehouse` (text, optional): The warehouse for product lines that name none.
    - `notes` (text, optional): A note saved on the operation.
    - `lines` (list of records): The lines, 1 to 200: kind (product or service), code, quantity, price without VAT, discount_percent, vat_percent, warehouse.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.
    - `document_file` (file, optional): A workflow file.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.
    - `created` (yes/no): False when the same document was found and returned.
    - `client_code` (text): The client's code.
    - `currency` (text): The document currency.
    - `amount` (text): The document's amount as Finvalda shows it, exact decimal.
    - `total_without_vat` (text): Of a new document: its lines without VAT, exact decimal.
    - `total_vat` (text): Of a new document: its VAT, exact decimal.
    - `attachment_name` (text): The attached file's name in Finvalda.
    - `invoice` (record): The document as Finvalda has it. Fields: `journal`, `op_number`, `series`, `document`, `client_code`, `client_name`, `date`, `payment_date`, `currency`, `amount`, `created_at`, `edited_at`.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Register payment

    Registers money received from a client (inflow) or paid to a supplier (disbursement), against one document or as a prepayment. Not safe to run again by itself: when the client already has an inflow or disbursement with this document number, the step stops with a conflict and writes nothing — after a rerun, check Finvalda. Two payments of one client under one bank statement number do not pass: give each its own document number.

    Action id `register_payment` · changes data in Finvalda · Finvalda: `GetOperations (look the payment up)`, `InsertNewOperation IplDok / IsmDok`

    **Inputs**

    - `direction` (one of incoming, outgoing): incoming (from a client) or outgoing (to a supplier).
    - `client_code` (text, optional): The client's code in Finvalda.
    - `client_company_code` (text, optional): The client's company code; used when no client code is given.
    - `document` (text): The payment's document number, for example the bank statement line.
    - `amount` (decimal): The amount paid, in the currency.
    - `date` (date and time, optional): The payment date, YYYY-MM-DD. Default: today.
    - `currency` (text, optional): A currency code such as EUR. Default: EUR.
    - `invoice_series` (text, optional): The series of the document paid.
    - `invoice_document` (text, optional): The number of the document paid. Without it, the payment is a prepayment.
    - `description` (text, optional): A description saved on the payment.
    - `import_parameter` (text, optional): The Finvalda import parameter (sParametras) that sets the journal, operation type, series and accounts. Default: the connection's operation import parameter.

    **Results**

    - `journal` (text): The saved operation's journal.
    - `op_number` (whole number): Its number in the journal.
    - `series` (text): Its document series.
    - `document` (text): Its document number.
    - `client_code` (text): The client's code.
    - `payment` (record): The payment as Finvalda has it. Fields: `journal`, `op_number`, `series`, `document`, `client_code`, `client_name`, `date`, `payment_date`, `currency`, `amount`, `created_at`, `edited_at`.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Download invoice PDF

    Prints a sale or purchase with an invoice form to a PDF workflow file, to e-mail it or archive it.

    Action id `download_invoice_pdf` · reads only · Finvalda: `MakeInvoice`

    **Inputs**

    - `invoice_form` (text): The form's code, for example PARD_01 (List · Invoice forms).
    - `journal` (text, optional): The operation's journal; with op_number.
    - `op_number` (whole number, optional): The operation's number; with journal.
    - `series` (text, optional): The document series; with document.
    - `document` (text, optional): The document number; with series.

    **Results**

    - `document_file` (file): A workflow file.
    - `file_name` (text): The file's name.
    - `size_bytes` (whole number): The file's size.

    ### Attach file

    Stores a workflow file in Finvalda and attaches it to a sale, a purchase or another operation, or to a client or product. A file of the same name already attached there is not attached twice.

    Action id `attach_file` · changes data in Finvalda · Finvalda: `GetAttachedDocument`, `InsertDocument`, `AttachDocument`

    **Inputs**

    - `entity_type` (one of 1, 2, 3, 7, 8, 16, 74, 75, …): What the file belongs to.
    - `entity_id1` (text): A record's code, or an operation's journal.
    - `entity_id2` (text, optional): An operation's number; empty for records.
    - `document_file` (file): A workflow file.
    - `file_name` (text): The name to store it under, with its extension, for example S-1001.pdf.
    - `file_description` (text, optional): A description of the file.

    **Results**

    - `file_name` (text): The file's name in Finvalda's register.
    - `stored` (yes/no): True when this step stored the file.
    - `attached` (yes/no): True when this step attached it.

    ### Stock levels

    Current stock of products by warehouse: quantity, quantity with reservations and cost.

    Action id `stock_levels` · reads only · Finvalda: `GetDescriptions type=CurrentStock`

    **Inputs**

    - `product_codes` (list, optional): The product codes; default all.
    - `warehouse` (text, optional): Only the stock of this warehouse.
    - `warehouse_group` (text, optional): Only this warehouse group.
    - `limit` (whole number, optional): Rows per step, 1 to 500. Default 200.
    - `page` (whole number, optional): The page to read, from 1; pass next_page to continue.

    **Results**

    - `items` (list of records): One row per product and warehouse. Fields: `code`, `name`, `warehouse`, `warehouse_name`, `quantity`, `quantity_with_reserved`, `unit`, `cost`.
    - `count` (whole number): How many rows were returned.
    - `has_more` (yes/no): True when more rows may follow.
    - `next_page` (whole number): The page to read next, or null.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Product prices

    The six sales prices and the purchase price of products, and a client's special prices and discounts when a client is given.

    Action id `product_prices` · reads only · Finvalda: `GetDescriptions type=Products`, `GetDescriptions type=Prices`

    **Inputs**

    - `product_codes` (list): The product codes, 1 to 200.
    - `client_code` (text, optional): Also read this client's special prices.

    **Results**

    - `items` (list of records): One row per product. Fields: `code`, `name`, `price1`, `price2`, `price3`, `price4`, `price5`, `price6`, `currency`, `purchase_price`, `purchase_currency`, `vat_percent`.
    - `client_prices` (list of records): The client's special prices and discounts. Fields: `client_code`, `code`, `name`, `price`, `currency`, `discount_percent`, `from_quantity`, `valid_from`, `valid_to`.
    - `count` (whole number): How many rows were returned.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Client debt

    A client's current debt and unpaid sales documents, with the overdue part.

    Action id `client_debt` · reads only · Finvalda: `GetDescriptions type=Clients`, `GetNeapmoketiKliDok`

    **Inputs**

    - `client_code` (text): The client's code in Finvalda.
    - `as_of` (date and time, optional): The date overdue is counted at, YYYY-MM-DD. Default: today.

    **Results**

    - `client_code` (text): The client's code.
    - `client_name` (text): The client's name.
    - `debt` (text): The debt on the client card, exact decimal.
    - `unpaid_total` (text): The sum of unpaid documents, exact decimal.
    - `overdue_total` (text): The unpaid sum past its due date, exact decimal.
    - `documents` (list of records): The unpaid documents. Fields: `document`, `series`, `journal`, `op_number`, `date`, `due_date`, `amount`, `remaining`, `amount_currency`, `remaining_currency`, `currency`, `overdue`.
    - `count` (whole number): How many rows were returned.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).

    ### Changes since

    Records or operations created or edited since a moment: clients, products, services, sales, purchases, inflows, disbursements. Pass next_since as since next time. Since is inclusive and records of one edit time are never split; next_since is the last edit time returned, so the records of that time come again next time: repeated, never lost — skip them by code.

    Action id `changes_since` · reads only · Finvalda: `GetDescriptions (EditedFrom)`, `GetOperations (DateEditedFrom)`

    **Inputs**

    - `entity` (one of clients, products, services, sales, purchases, inflows, disbursements): Which records or operations.
    - `since` (date and time): YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS; records edited at or after it.
    - `limit` (whole number, optional): About this many rows, 1 to 300 (default 200), the records at since included. Records of one edit time are never split, so a page may hold more: the next edit time is always included, up to 600 records.
    - `skip_group` (yes/no, optional): Leave out the records edited exactly at since. Only when they were already read: a record edited later with the same coarse time would be missed.

    **Results**

    - `records` (list of records): The records edited since, as client, product, service or operation records.
    - `count` (whole number): How many rows were returned.
    - `latest_edited` (text): The edit time of the last record returned, ISO 8601.
    - `next_since` (text): Pass it as since next time: the last edit time returned (its records come again), or since when nothing later was found.
    - `has_more` (yes/no): True when more records follow; continue with since = next_since.
    - `undated` (list of records): Records whose edit time Finvalda gives in no known form (up to 100), with the last page only.
    - `undated_count` (whole number): How many records have an edit time in no known form.
    - `warnings` (list): What the step could not do fully: read a record back after its write, or read a value of the type its field has (that value is returned as Finvalda sent it).
- component_id: operations_behaviour
  type: markdown
  title: How steps behave
  body: |
    ### The web service

    - Every step calls the Finvalda web service of your company (the FvsServicePure interface) with the web service user of the connection. A step can do exactly what that user may do in Finvalda.
    - Writes of operations use an import parameter (sParametras): a preset made in Finvalda's FvsNETParamKonfig tool that sets the journal, operation type, series and accounts. New clients, products and services can use an item import parameter the same way. Set defaults on the connection; a step can name another.
    - The older read methods answer with Lithuanian column names, or English ones when the connection's language is English. The list steps (List · …) and the operation steps (Operations · …) always use English column names.

    ### Inputs

    - Fields of records and operations use the names of Finvalda's manual (sKodas, sPavadinimas, tData, PardDokPrekeDetEil …). They are checked against the manual before anything is sent: an unknown field, a text that is too long or a value of the wrong kind is refused.
    - Dates are YYYY-MM-DD. Amounts are exact decimals with "." as the decimal point.
    - Results give every number Finvalda returns as exact decimal text ("12.50"), never rounded through floating point.

    ### Writes, retries and errors

    - Flow Steward remembers every change it made, so a retried step does not send it twice. Test runs never write.
    - When Finvalda refuses a change, it says why with its error code, and nothing was saved. The step shows the code and its meaning from the manual.
    - A timeout, a lost connection, a server error, or one of the errors the manual describes as a program or transaction failure leave the outcome unknown: the step is not retried, and you check Finvalda first.
    - Everyday steps look up before they create: clients and products by code, documents and payments by their number for that client. Finvalda itself refuses a document number already used.
    - If a step that writes several things fails half-way, it says exactly what was already saved.

    ### Lists and files

    - List steps read pages of up to 1000 rows. A step output has a size limit: a long read stops at a page boundary and returns next_page. For whole lists use Export a list to a file.
    - Operation steps read everything the filter matches in one answer: give a date range or a journal.
    - Files travel as workflow files: invoice and report PDFs, product pictures, documents attached to operations.
- component_id: operations_lists
  type: markdown
  title: Lists
  body: |
    Clients, products, services, stock, prices and every other list Finvalda's GetDescriptions method reads, with filters, columns and pages.

    ### List · Chart of accounts

    Chart of accounts, read with Finvalda's GetDescriptions method, type Accounts (documented in the Postman collection). Pages of rows; columns can be chosen.

    Action id `descriptions_accounts` · reads only · Finvalda: `POST GetDescriptions type=Accounts`

    **Inputs**

    - `filter` (record, optional): Conditions as an object with any of: Codes, CreatedFrom, EditedFrom, Group. Lists (Codes) are arrays.
    - `columns` (list, optional): The columns to return; default all.
    - `page` (whole number, optional): The page to read, from 1. Default 1.
    - `limit` (whole number, optional): Rows per page, 1 to 1000. Default 500.
    - `fetch_all_pages` (yes/no, optional): Read page after page up to max_pages.
    - `max_pages` (whole number, optional): With fetch_all_pages: at most this many pages, 1 to 100.

    **Results**

    - `records` (list): The rows of chart of accounts. Columns not documented by Finvalda. Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them.
    - `count` (whole number): How many rows were returned.
    - `page` (whole number): The last page read.
    - `next_page` (whole number): The page to read next, or null.
    - `has_more` (yes/no): True when more rows may follow.
    - `pages_fetched` (whole number): How many pages were read.

    ### List · Client addresses

    Client addresses, read with Finvalda's GetDescriptions method, type Address (documented in manual section 4). Pages of rows; columns can be chosen.

    Action id `descriptions_address` · reads only · Finvalda: `POST GetDescriptions type=Address`

    **Inputs**

    - `filter` (record, optional): One object per filter group — Clients: {Codes, CompanyCode, VatCode, Tag1, Tag2, Tag3, Tag4, Tag5}; Address: {Codes, Tag1, Tag2, Tag3, Tag4, Tag5}.
    - `columns` (list, optional): The columns to return; default all. Only the columns Finvalda documents for this list.
    - `page` (whole number, optional): The page to read, from 1. Default 1.
    - `limit` (whole number, optional): Rows per page, 1 to 1000. Default 500.
    - `fetch_all_pages` (yes/no, optional): Read page after page up to max_pages.
    - `max_pages` (whole number, optional): With fetch_all_pages: at most this many pages, 1 to 100.

    **Results**

    - `records` (list of records): The rows of client addresses. Numbers are exact decimal text. Columns the manual documents with a type are given in it (dates YYYY-MM-DD, times ISO 8601 with Lithuania's offset); other columns are as Finvalda sends them. Fields: `client`, `code`, `info1`, `info2`, `info3`, `tag1`, `tag2`, `tag3`, `tag4`, `tag5`, `city`, `email`, `post_code`, `country`, `phone`, `street`, ….
    - `count` (whole number): How many rows were returned.
    - `page` (whole number): The last page read.
    - `next_page` (whole number): The page to read next, or null.
    - `has_more` (yes/no): True when more rows may follow.
    - `pages_fetched` (whole number): How many pages were read.

    ### List · Product barcodes

    Product barcodes, read with Finvalda's GetDescriptions method, type BarCodes (documented in manual section 4). Pages of rows; columns can be chosen.

    Action id `descriptions_bar_codes` · reads only · Finvalda: `POST GetDescriptions type=BarCodes`

