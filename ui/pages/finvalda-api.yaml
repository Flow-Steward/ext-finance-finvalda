    Sales, purchases, returns, payments, transfers and every other operation class Finvalda's GetOperations method reads.

    ### Operations · Sales

    Sales, read with Finvalda's GetOperations method, class Sales (documented in manual section 3.77). Give a filter — a date range, a journal, a client — to keep the answer small.

