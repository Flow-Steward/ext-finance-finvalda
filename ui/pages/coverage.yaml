  type: markdown
  title: Coverage
  body: |
    The steps cover the whole web service Finvalda documents: the manual "FVS Webserviso metodų naudojimo instrukcija" (revision 110, 2025-04-14) and Finvalda's [Postman collection](https://documenter.getpostman.com/view/7208231/2s8YmRMLvd).

    - **Methods:** 170 names, each with a step or a reason below.
    - **Lists (GetDescriptions types):** 34, one step each (List · …).
    - **Operation classes (GetOperations):** 27, one step each (Operations · …).
    - **Record and operation classes (writes):** 111, through Create a record, Update a record, Create an operation, Change an operation and Delete an operation.
    - **XML twins:** 57 methods ending in Xml return the same data as their method without Xml, as an XML string. Each is offered by that method's step, which returns the data as JSON (tests/reference/coverage.json lists every pair).

    ### Names with a note

    - **TagsAndTypes** → Advanced · List · Types and tags. The manual's section heading; the type it describes is TypesAndTags.
    - **WareHouseGroups** → Advanced · List · Warehouse groups. The manual's section heading; the type it describes is WarehouseGroups.
    - **Fvs.KlientoIndividKort** → Advanced · Create a record. Field names come from the Postman example only.
    - **TrumpasUVMPardRezDok** → Advanced · Create an operation. The method's class list name; its fields are those of TrumpasUVMPardRDok.
    - **DeleteDokumentas** → Advanced · Delete a document. The revision history's name of DeleteDocument.
    - **EditItemsProps** → Advanced · Update many records. The method list's spelling of EditItemProps.
    - **GetAttachedDocument** → Advanced · Attached documents. The Pure interface's name of GetAttachedDocuments.
    - **GetEinamiejiLikuciaiSandelyje** → Advanced · Current stock. Removed by the manual's revision 4; GetEinamiejiLikuciai takes the warehouse instead.
    - **GetFvsUser** → no step. Not offered: it takes another Finvalda user's name and password as parameters, and a workflow input is no place for a password. The connection's own user is checked by Test the connection.
    - **GetKlientuSet** → Advanced · Clients. A misspelling of GetKlientusSet in the revision history.
    - **GetMokeciai** → Advanced · Taxes. A misspelling of GetMokesciai in a signature.
    - **GetPalsaugosSet** → Advanced · Services. A misspelling of GetPaslaugosSet in a signature.
    - **GetUzsakytasPrekes** → Advanced · Call a Finvalda method. Named only in the manual's revision history (revision 13), with no section and no parameters: reachable through Call a Finvalda method.
    - **InsertNew** → Advanced · Create an operation. Short for InsertNewOperation in the revision history.
    - **IsLocked** → Advanced · Is an operation locked. The answer field of IsOperationLocked, not a method.
    - **IsOperatonLocked** → Advanced · Is an operation locked. A misspelling of IsOperationLocked in the revision history.

    ### Not verified on a live server

    - No Finvalda server was available while this version was built, so every step follows the manual and the Postman collection and has been tested against recorded answers only.
    - For a few parameters, a published client reports that the live interface reads another name than the manual (sSandKod for sSanKod; tDataNuo and tDataIki for tNuo and tIki of the order management reads). Those steps send both names.
    - The document methods (InsertDocument, AttachDocument, GetAttachedDocument) are written as the manual's Pure examples show them.
    - The everyday steps take the operation lists' client column for the client's code (as in the Postman example of Sales, where client_code holds the company code). If a live server shows otherwise, a purchase or payment could be registered twice: check this first.
    - Register payment with an invoice returns an earlier payment only when its lines' journal_det and op_number_det (the manual's line columns, taken as the operation a line settles) point at the invoice; any other payment of the client with that statement number and amount stops the step, so nothing is registered twice while their meaning is unconfirmed.
    - Attach file stores the file in Finvalda's document register before attaching it. The manual documents no "already stored" answer, so a rerun after a stored but unattached file stops with Finvalda's refusal (or stores it again) instead of attaching a file of the same name that may be another one.
    - Invoices related to a client sends the client as sKlientoKodas, a name from a published client, not from Finvalda; the step passes on only rows that show they belong to that client.
