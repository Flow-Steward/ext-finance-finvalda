manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.finvalda
kind: tool_provider
version: 0.1.0
release_stage: active
billing_mode: free
display_name: Finvalda
description: Finvalda accounting through its web service (FvsServicePure) for workflows. Everyday steps
  — find or create clients, products and services, create sales and purchase invoices, register payments,
  invoice PDFs, attach files, stock levels, prices, client debt and changes since a date — plus every
  documented web service method, list and operation class as a typed workflow step.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-finvalda/issues
  website_url: https://github.com/Flow-Steward/ext-finance-finvalda
listing:
  category: finance
  tags:
  - finvalda
  - accounting
  - erp
  - lithuania
  - invoices
  - inventory
  - payments
  summary: Everyday Finvalda steps — invoices, clients, products, payments, stock, prices, debts — plus
    every documented web service method.
  categories:
  - finance
  - inventory
  - sales
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_finvalda
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each Finvalda web service user and company is a project connection. A project may hold
    several, for example one per company.
egress:
  connection_fields:
  - finvalda.base_url
