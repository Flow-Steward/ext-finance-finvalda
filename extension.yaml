extension_id: flowsteward.finvalda
kind: tool_provider
version: 0.1.2
release_stage: active
billing_mode: free
display_name: Finvalda
description: 'Bring Finvalda accounting and business records into Flow Steward through
  the FvsServicePure web service. Everyday steps find or create clients, products
  and services, prepare sales and purchase invoices, register incoming or outgoing
  payments and work with invoice PDFs and attachments. Client searches can use business
  identifiers or email, while product searches can use codes or barcodes.


  Read warehouse stock, reserved quantities, costs, sales and purchase prices, client-specific
  prices and outstanding debt. Date-based change reads expose clients, products, services,
  sales, purchases and payments for incremental exchange with other systems. Files
  move through Flow Steward storage, so a workflow can pass an invoice PDF to another
  document, email or archival step.


  For more detailed integrations, the release includes 160 advanced operations derived
  from its pinned Finvalda reference. These cover description lists, operation classes,
  older record readers, record and document changes, locking, copying, journal moves,
  invoice and report generation and list exports. Combine these steps to turn shop
  orders into accounting documents, feed warehouse availability to a storefront or
  check unpaid invoices before processing a new order. Each connection carries its
  company and import settings; the configured Finvalda user and employee permissions
  control access.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-finvalda/issues
  website_url: https://github.com/Flow-Steward/ext-finance-finvalda
listing:
  category: finance
  tags:
  - finvalda
  - accounting
  - erp
  - lithuania
  - invoices
  - inventory
  - payments
  summary: Connect Finvalda invoices, clients, products, payments, stock, prices,
    debt checks and document files to business workflows.
  categories:
  - finance
  - inventory
  - sales
  setup_summary: Have your Finvalda administrator enable FvsServicePure on a publicly
    reachable HTTPS host and create a web-service user. Configure the company, Finvalda
    employee and separate operation and record import parameters in the project connection,
    then run the connection test.
