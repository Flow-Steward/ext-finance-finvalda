            type: *id026
            description: Finvalda's column warehouse.
          warehouse_title:
            type: *id026
            description: Finvalda's column warehouse_title.
          product:
            type: *id026
            description: Finvalda's column product.
          title:
            type: *id026
            description: Finvalda's column title.
          type:
            type: *id026
            description: Finvalda's column type.
          supplier:
