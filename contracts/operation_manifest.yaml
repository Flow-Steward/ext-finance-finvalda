- operation_id: export_list
  display_name: Advanced · Export a list to a file
  description: Saves a whole GetDescriptions list — clients, products, stock, prices … — as a JSON Lines
    workflow file, page by page; it can resume where it stopped.
  operation_kind: source
  category: finance
  connection_type_ids:
  - finvalda
  workflow_visible: true
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: list_type
    value_type: text
    required: true
    schema:
      type: string
      enum:
      - Accounts
      - Address
      - BarCodes
      - CalendarEvents
      - ClientGroups
      - ClientIndividualCards
      - Clients
      - CompanyWorkStart
      - CountClients
      - CountSales
      - CurrencyRates
      - CurrentStock
      - CurrentStockDet
      - DocumentSeries
      - FixedAsset
      - InvoiceList
      - LogbookGroups
      - OpTypeGroups
      - OperationStatuses
      - PartnerProducts
      - Prices
      - PricesByClientAndItemTypes
      - PricesByClientType
      - PricesByItemType
      - ProductionItem
      - Products
      - ReportList
      - Services
      - StockOnDate
      - TypesAndTags
      - Vehicles
      - WarehouseGroups
      title: List
      description: The GetDescriptions type, for example Clients.
  - name: filter
    value_type: object
    required: false
    schema:
      type: object
      title: Filter
      description: The same filter as the list's own step.
  - name: columns
    value_type: array
    required: false
    schema:
      type: array
      title: Columns
      description: The columns to save; default all.
      maxItems: 200
      items:
        type: string
  - name: start_page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
      title: Start page
      description: The page to start from; pass resume_page to continue.
  - name: max_pages
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 2000
      title: Max pages
      description: At most this many pages of 1000 rows, 1 to 2000.
  outputs:
  - name: artifact_handle
    value_type: artifact_handle
  - name: filename
    value_type: text
    schema:
      type: string
  - name: content_type
    value_type: text
    schema:
      type: string
  - name: record_count
    value_type: integer
    schema:
      type: integer
  - name: pages_fetched
    value_type: integer
    schema:
      type: integer
  - name: complete
    value_type: boolean
    schema:
      type: boolean
      description: True when the last page was reached.
  - name: resume_page
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The page to continue from.
  - name: stopped_by
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: Why the export stopped early.
  result_fields:
