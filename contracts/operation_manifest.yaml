- operation_id: changes_since
  display_name: Read records changed since a date
  description: 'Records or operations created or edited on or after a date: clients, products, services,
    sales, purchases, inflows, disbursements, page by page in a fixed order. Finvalda filters by date
    only, so asking again with the same date returns that day''s records again — skip them by code; nothing
    is lost.'
  operation_kind: source
  category: finance
  connection_type_ids:
  - finvalda
  workflow_visible: true
  inputs:
  - name: connection_ref
