      description: 'Conditions as an object with any of: Journal, JournalGroup, OpNumber, Series, OrderNumber,
        OpDateFrom, OpDateTill, DateEditedFrom, DateCreatedFrom, Client, ClientGroup, OpType, OpTypeGroup,
        Description, Description2, Description3, Description4, Description5, NotCreatedByUser, NotEditedByUser,
        NotChangedByUser. Dates are YYYY-MM-DD; Description fields accept * as a wildcard.'
      additionalProperties: false
      properties:
        Journal:
