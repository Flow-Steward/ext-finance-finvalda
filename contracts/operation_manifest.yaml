  - &id021
    name: attachment_name
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The attached file's name in Finvalda.
  - &id022
    name: invoice
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - journal
      - op_number
      - series
      - document
      - client_code
      - client_name
      - date
