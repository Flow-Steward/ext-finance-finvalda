- operation_id: call_method
  display_name: Advanced · Call a Finvalda method
  description: Calls any method of the Finvalda web service by name, with query parameters or a JSON body,
    for cases the other steps do not cover. Counted as a change.
  operation_kind: action
  category: finance
  connection_type_ids:
  - finvalda
  workflow_visible: true
  effect_kind: finvalda_call_method
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: method
    value_type: text
    required: true
    schema:
      type: string
      title: Method
      description: The method name, for example GetKlientusSet.
      maxLength: 80
  - name: verb
    value_type: text
    required: true
    schema:
      type: string
      enum:
      - GET
      - POST
      title: HTTP method
      description: GET or POST, as the method expects.
  - name: query
    value_type: object
    required: false
    schema:
      type: object
      title: Query parameters
      description: 'Parameters for the address, for example {"sKliKod": "K1"}.'
  - name: body
    value_type: object
    required: false
    schema:
      type: object
      title: Body
      description: A JSON body for POST.
  outputs:
  - name: method
    value_type: text
    schema:
      type: string
  - *id029
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
