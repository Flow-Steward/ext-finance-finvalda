      - incoming
      - outgoing
      title: Direction
      description: incoming (from a client) or outgoing (to a supplier).
  - name: client_code
    value_type: text
    required: false
    schema: *id007
  - name: client_company_code
    value_type: text
    required: false
    schema: *id008
  - name: document
    value_type: text
    required: true
    schema:
      type: string
      title: Payment document
      description: The payment's document number, for example the bank statement line.
      maxLength: 20
  - name: amount
    value_type: text
    required: true
    schema:
      type:
      - string
      - number
