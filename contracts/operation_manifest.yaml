- operation_id: register_payment
  display_name: Register payment
  description: 'Registers money received from a client (inflow) or paid to a supplier (disbursement),
    against one document or as a prepayment. Not safe to run again by itself: when the client already
    has an inflow or disbursement with this document number, the step stops with a conflict and writes
    nothing — after a rerun, check Finvalda. Two payments of one client under one bank statement number
    do not pass: give each its own document number.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - finvalda
  workflow_visible: true
  effect_kind: finvalda_register_payment
