    value_type: text
    required: true
    schema:
      type: string
      title: Method
      description: The method name, for example GetKlientusSet.
      maxLength: 80
  - name: verb
    value_type: text
    required: true
    schema:
      type: string
      enum:
      - GET
      - POST
      title: HTTP method
      description: GET or POST, as the method expects.
  - name: query
    value_type: object
    required: false
    schema:
      type: object
      title: Query parameters
      description: 'Parameters for the address, for example {"sKliKod": "K1"}.'
  - name: body
    value_type: object
    required: false
    schema:
      type: object
      title: Body
      description: A JSON body for POST.
  outputs:
  - name: method
    value_type: text
    schema:
      type: string
