  display_name: Advanced · Operations · Production
  description: Production, read with Finvalda's GetOperations method, class Production (documented in
    the Postman collection). Give a filter — a date range, a journal, a client — to keep the answer small.
  operation_kind: source
  category: finance
  connection_type_ids:
