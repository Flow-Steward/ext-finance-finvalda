      - 'null'
      description: Its document series.
  - &id014
    name: document
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: Its document number.
  - &id015
    name: created
    value_type: boolean
    schema:
      type: boolean
      description: False when the same document was found and returned.
  - &id016
    name: client_code
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The client's code.
  - &id017
