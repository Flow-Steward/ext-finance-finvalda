  - name: fin_user
    value_type: text
    required: false
    schema: *id037
  outputs:
  - name: permissions
    value_type: array
    schema:
      type: array
      description: One entry per permission class (manual 3.84).
      items:
        type: object
        properties:
          perrmisionClass:
            type: *id023
            description: 65 warehouses, 6 clients, 51 operation types, 81 journals.
          perrmisionCode:
            type: *id001
            description: The permission group's code.
          permittedEntities:
            type:
            - array
            - object
            - 'null'
            description: The permitted codes (id1, id2).
