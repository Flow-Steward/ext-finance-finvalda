          measure_unit:
            type: *id026
            description: Finvalda's column measure_unit.
          quantity:
            type: *id026
            description: Finvalda's column quantity.
          primary_cost:
            type: *id026
            description: Finvalda's column primary_cost.
          account:
            type: *id026
            description: Finvalda's column account.
