- operation_id: create_sales_invoice
  display_name: Create sales invoice
  description: 'Creates a sales invoice (PardDok) with product and service lines; amounts and VAT are
    computed from quantity, price, discount and VAT percent. The document number makes it safe to run
    again: the step first looks for a sales invoice of that client with that number and returns it instead
    of a second one, and Finvalda itself refuses a number already used. Can attach a file, such as the
    PDF, for which the connection needs a Finvalda employee.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - finvalda
  workflow_visible: true
  effect_kind: finvalda_create_sales_invoice
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: client_code
    value_type: text
    required: false
    schema: &id003
      type: string
      title: Client code
      description: The client's code in Finvalda.
      maxLength: 15
  - name: client_company_code
    value_type: text
    required: false
    schema: &id004
      type: string
      title: Client company code
      description: The client's company code; used when no client code is given.
      maxLength: 30
  - name: document
    value_type: text
    required: true
    schema:
      type: string
      title: Document number
      description: The sales invoice's number, for example S-1001. Makes reruns safe.
      maxLength: 20
  - name: series
    value_type: text
    required: false
    schema:
      type: string
      title: Series
      description: 'The document series. Default: from the import parameter.'
      maxLength: 10
  - name: date
    value_type: text
    required: false
    schema:
      type: string
      title: Date
      description: 'The operation date, YYYY-MM-DD. Default: today.'
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: due_date
    value_type: text
    required: false
    schema:
      type: string
      title: Due date
      description: The payment date, YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: currency
    value_type: text
    required: false
    schema:
      type: string
      title: Currency
      description: 'A currency code such as EUR. Default: EUR.'
      maxLength: 3
  - name: warehouse
    value_type: text
    required: false
    schema:
      type: string
      title: Warehouse
      description: The warehouse for product lines that name none.
      maxLength: 10
  - name: notes
    value_type: text
    required: false
    schema:
      type: string
      title: Notes
      description: A note saved on the operation.
      maxLength: 255
  - name: lines
    value_type: array
    required: true
    schema:
      type: array
      title: Lines
      description: 'The lines, 1 to 200: kind (product or service), code, quantity, price without VAT,
        discount_percent, vat_percent, warehouse.'
      minItems: 1
      maxItems: 200
      items: &id005
        type: object
        additionalProperties: false
        required:
        - code
        - quantity
        - price
        properties:
          kind:
            type: string
            enum:
            - product
            - service
            description: product (default) or service.
          code:
            type: string
            maxLength: 20
            description: The product's or service's code.
          quantity:
            type:
            - number
            - string
            description: Quantity, in the primary unit.
          price:
            type:
            - number
            - string
            description: Unit price without VAT, in the document currency.
          discount_percent:
            type:
            - number
            - string
            description: Discount in percent.
          vat_percent:
            type:
            - number
            - string
            description: VAT percent; the VAT amount is computed.
          vat_code:
            type: string
            maxLength: 10
            description: The VAT (tax) code.
          warehouse:
            type: string
            maxLength: 10
            description: 'Products: the warehouse. Default: the step''s warehouse.'
          amount_eur:
            type:
            - number
            - string
            description: The line amount in EUR; needed when the currency is not EUR.
          objects:
            type: array
            items:
              type: string
              maxLength: 10
            maxItems: 6
            description: Object codes 1 to 6.
  - name: import_parameter
    value_type: text
    required: false
    schema: &id006
      type: string
      title: Import parameter
      description: 'The Finvalda import parameter (sParametras) that sets the journal, operation type,
        series and accounts. Default: the connection''s operation import parameter.'
      maxLength: 100
  - name: document_file
    value_type: artifact_handle
    required: false
  outputs:
  - &id007
    name: journal
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The saved operation's journal.
  - &id008
    name: op_number
    value_type: integer
    schema:
      type:
